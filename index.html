<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推荐报告编辑器 · Demo</title>
<style>
:root{--ink:#1b2232;--muted:#667085;--line:#e4e7ee;--bg:#eef0f5;--p:#4f46e5;--p2:#eef0ff;--ok:#0f9d75;--ok2:#e6f7f1;--warn:#b45309;--warn2:#fff4dc;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;height:100vh;display:grid;grid-template-rows:54px 1fr}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;white-space:nowrap}
button:hover{background:#fafbfd;border-color:#c7cbd6}
button.primary{background:var(--p);color:#fff;border-color:var(--p)}button.primary:hover{background:#4338ca}
button.ghost{border-color:transparent;background:transparent;color:var(--p)}
button.sm{padding:4px 9px;font-size:12.5px}
button.danger{color:var(--danger);border-color:#f3c3c3}
textarea,input,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--p)}
header{display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
header .logo{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;margin-right:6px}
header .logo i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#4f46e5,#06b6d4);display:inline-block}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn2);color:var(--warn)}
header .sp{flex:1}
.hint{font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:360px 1fr;min-height:0}
main.collapsed{grid-template-columns:0 1fr}
.side{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px}
main.collapsed .side{display:none}
h3{font-size:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h3 small{font-weight:400;color:var(--muted);font-size:12px}
.blk{margin-bottom:16px}
.drop{border:2px dashed #c9cfdd;border-radius:10px;padding:12px;text-align:center;color:var(--muted);background:#fafbfe;cursor:pointer;font-size:13px}
.drop.hover{border-color:var(--p);background:var(--p2)}
.drop b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;background:#eef1f6;color:var(--muted)}
.pill.ok{background:var(--ok2);color:var(--ok)}.pill.warn{background:var(--warn2);color:var(--warn)}.pill.p{background:var(--p2);color:var(--p)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:13px;align-items:center}
.kv label{color:var(--muted);font-size:12.5px}
.kv input{padding:5px 8px;font-size:13px}
/* canvas */
.canvas{overflow:auto;padding:18px 24px 60px;position:relative}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:0 auto 14px;max-width:820px;box-shadow:0 2px 8px rgba(20,30,60,.06)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.toolbar button{padding:4px 9px;font-size:13px;border-color:transparent}
.toolbar button:hover{background:var(--p2);border-color:transparent}
.toolbar .sw{width:22px;height:22px;border-radius:5px;border:1px solid #ddd;cursor:pointer}
.toolbar select{width:auto;padding:3px 6px;font-size:12.5px}
.paper{background:#fff;width:820px;margin:0 auto;padding:46px 56px;box-shadow:0 4px 24px rgba(20,30,60,.08);min-height:1000px;position:relative;font-size:14px;line-height:1.85;color:#111}
.paper [contenteditable]:focus{outline:none;background:#fbfbff}
.paper .doc-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:12px}
.paper .sec-h{font-size:15px;font-weight:700;margin:14px 0 6px;padding-left:8px;border-left:3px solid var(--p);display:flex;align-items:center;justify-content:space-between}
.paper .sec-h .ctl{font-size:12px;font-weight:400;color:var(--muted);display:none;gap:6px}
.paper:hover .sec-h .ctl{display:flex}
.frow{display:grid;grid-template-columns:18px minmax(90px,max-content) 1fr 22px;gap:0 8px;align-items:start;padding:1px 4px;margin:0 -4px;border-radius:6px;position:relative}
.frow:hover{background:#f7f8ff}
.frow .h{color:#c5c9d6;cursor:grab;font-size:14px;line-height:1.85;opacity:0}
.frow:hover .h{opacity:1}
.frow .lab{font-weight:600;white-space:nowrap;outline:none;border-bottom:1px dashed transparent}
.frow .lab:hover,.frow .lab:focus{border-bottom-color:#c7cbd6}
.frow .lab::after{content:'：'}
.frow .v{outline:none;min-height:1.85em;white-space:pre-wrap}
.frow .v:empty::before{content:attr(data-ph);background:var(--warn2);color:var(--warn);border:1px dashed #f0c27a;border-radius:4px;padding:0 6px;font-size:12.5px;font-weight:500;white-space:normal}
.tplrow{border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-bottom:6px}.tplrow.cur{border-color:var(--p);background:#fbfbff}
.tplhead{display:flex;align-items:center;gap:6px}.tplhead b{cursor:pointer;color:var(--p)}.tplhead b:hover{text-decoration:underline}.tplhead .sp{flex:1}
.tplfields{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:12.5px}.tplfields label{display:flex;gap:5px;align-items:flex-start;cursor:pointer}.tplfields input{width:auto;margin-top:3px}
.frow .x{opacity:0;color:#aab;cursor:pointer;font-size:14px;line-height:1.85;text-align:center}
.frow:hover .x{opacity:1}
.frow .x:hover{color:var(--danger)}
.frow.drag{opacity:.4}
.addrow{display:flex;gap:8px;align-items:center;margin:8px 0 4px;padding-left:26px}
.addrow input{width:200px;padding:5px 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding-left:26px;margin-bottom:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:#eef1f6;cursor:pointer;color:#445}
.chip:hover{background:var(--p2);color:var(--p)}
.chip.auto{background:var(--ok2);color:var(--ok)}
.divider{display:flex;align-items:center;gap:10px;color:#99a;font-size:12px;margin:22px 0 10px}
.divider::before,.divider::after{content:'';flex:1;border-top:1px dashed #ccd}
.divider .ctl{display:flex;gap:6px}
.resume{outline:none;min-height:120px}
.resume p{margin:0;white-space:pre-wrap;min-height:1em}
.resume img{max-width:100%}
.resume table{border-collapse:collapse;margin:4px 0}.resume td,.resume th{border:1px solid #ccc;padding:2px 6px}
.resume ul,.resume ol{padding-left:1.6em}
.pastebox{min-height:150px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;margin-top:8px;outline:none;background:#fff}
.pastebox:focus{outline:2px solid #c7d2fe;border-color:var(--p)}
.pastebox:empty::before{content:attr(data-ph);color:#aab}
.pastebox p{margin:0}.pastebox img{max-width:100%}
.resume:empty::before{content:'把候选人原始简历粘贴到这里（支持从 Word 直接粘贴保留格式），或在左侧上传后自动带入';color:#aab}
.pagebreak{border-top:2px dashed #cbd;margin:18px 0;text-align:center;font-size:11px;color:#aab;line-height:0}
.pagebreak span{background:#fff;padding:0 8px;position:relative;top:0;cursor:pointer}
.pagebreak:hover span{color:var(--danger)}
.toolbar button:disabled{color:#b8bcc8;cursor:default;background:none}
.toolbar button.on{background:var(--p);color:#fff}
body.brushing #paper [contenteditable]{cursor:cell}
.resume::after{content:"";display:block;clear:both}
.resume img{max-width:100%}
.wmlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none;grid-template-columns:repeat(2,1fr);grid-auto-rows:220px;place-items:center}
.paper.wm .wmlayer{display:grid}
.wmlayer span{transform:rotate(-28deg);white-space:nowrap;font-weight:700;color:#777}
.mark{background:#fff3b0}
.bubble{position:fixed;z-index:30;display:none;align-items:center;gap:6px;background:#1b2232;border-radius:9px;padding:6px 8px;box-shadow:0 6px 20px rgba(0,0,0,.25);color:#fff;font-size:14px;transform:translate(-50%,-100%);margin-top:-8px}
.bubble.on{display:flex}
.bubble .sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.4);cursor:pointer}
.bubble b,.bubble u,.bubble s,.bubble i{cursor:pointer;padding:0 5px;border-radius:4px;line-height:20px}
.bubble b:hover,.bubble u:hover,.bubble s:hover,.bubble i:hover{background:rgba(255,255,255,.18)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#1b2232;transform:translateX(-50%) rotate(45deg)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,30,60,.45);display:none;align-items:center;justify-content:center;z-index:40}
.modal.on{display:flex}
.box{background:#fff;border-radius:14px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:20px}
.box h3{font-size:16px;margin-bottom:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
table.t th{color:var(--muted);font-size:12px}
.tplgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tplcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.tplcard:hover{border-color:var(--p);background:#fbfbff}
.tplcard b{display:block;margin-bottom:3px}
.del{color:var(--danger);font-size:12px;margin-left:4px;text-decoration:none}.del:hover{text-decoration:underline}
.tplhead{flex-wrap:wrap}.tplhead button.sm{padding:3px 6px}
.tpled .row{display:flex;gap:6px;align-items:center;margin-bottom:5px}.tpled .row>label{width:36px;color:var(--muted);font-size:12.5px;text-align:right}.tpled input.l{width:230px}.tpled input.h{flex:1}.tpled .head{font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:2px}.tpled .paste{background:var(--bg);border-radius:10px;padding:10px 12px;margin:4px 0 12px}.tpled .paste .row{margin-bottom:0}.tpled textarea{display:block;width:100%;min-height:118px;font:inherit;font-size:13px;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:8px;resize:vertical;margin:8px 0;background:#fff}
.tplcard span{font-size:12px;color:var(--muted)}
@media print{body>*{display:none!important}#printArea{display:block!important}#printArea .paper{box-shadow:none;width:auto;min-height:0;margin:0}#printArea .frow .h,#printArea .frow .x,#printArea .ctl,#printArea .addrow,#printArea .chips{display:none!important}#printArea .frow{grid-template-columns:minmax(90px,max-content) 1fr;gap:0 8px;padding:1px 0;margin:0}#printArea .frow .v{min-height:0}#printArea .pagebreak{page-break-after:always;border:none;height:0}#printArea .pagebreak span{display:none}#printArea .frow .v:empty::before{content:'【待补充】';background:none;border:none;color:#b45309}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>推荐报告编辑器 <span class="badge">Demo</span></div>
  <button class="sm" onclick="toggleSide()" id="sideBtn">收起资料栏</button>
  <span class="hint">原始简历按原排版带入（字号、颜色、分栏保留），和推荐语在同一份文档里编辑；字段随客户要求增删</span>
  <div class="sp"></div>
  <button onclick="resetDoc()" title="清空当前文档，回到刚打开时的状态（可撤销）">新建报告</button>
  <button onclick="openTpls()">字段模板</button>
  <button onclick="openHist()">历史</button>
  <button onclick="copyText()">复制纯文本</button>
  <button onclick="exportWord()">导出 Word</button>
  <button class="primary" onclick="exportPdf()">导出 PDF</button>
</header>
<main id="main">
  <aside class="side">
    <div class="blk"><h3>资料来源 <small>解析后直接进入右侧文档</small></h3>
      <div class="drop" id="drop" onclick="document.getElementById('file').click()"><b>拖入原始简历</b>（PDF / Word / TXT）<br><span class="hint">PDF 保留原排版（字号、颜色、分栏）；Word(.docx) 保留标题 / 加粗 / 列表 / 表格。也可以直接把简历粘贴到右侧简历区</span></div>
      <input type="file" id="file" hidden accept=".pdf,.doc,.docx,.txt,.md">
      <div id="filetag" class="hint" style="margin-top:6px"></div>
    </div>
    <div class="blk"><h3>推荐模板 <small>点名称整套载入，展开可逐个勾选</small></h3>
      <div id="tplList"></div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="sm" onclick="newTpl(false)">新建模板</button><button class="sm ghost" onclick="newTpl(true)">把当前字段存为模板</button></div>
    </div>
    <div class="blk"><h3>文件信息</h3>
      <div class="kv"><label>推荐岗位</label><input id="position" placeholder="如：电气自动化技术员"><label>客户</label><input id="client" placeholder="如：歌尔"><label>输出文件名</label><div id="fname" class="hint" style="font-family:ui-monospace,Menlo,monospace;color:var(--ink)">—</div></div>
      <label style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px"><input type="checkbox" id="wmOn" style="width:auto" onchange="applyWm()"> 导出时加水印</label>
      <input id="wmText" value="仅供客户内部评估使用" style="margin-top:6px" oninput="applyWm()">
    </div>
  </aside>

  <div class="canvas">
    <div class="toolbar" onmousedown="if(event.target.tagName!=='SELECT')event.preventDefault()">
      <button id="undoBtn" onclick="undo()" disabled>↶ 撤销</button><button id="redoBtn" onclick="redo()" disabled title="重做">↷</button><span class="hint" id="undoHint"></span>
      <span class="sep"></span>
      <button onclick="fmt('bold')" title="加粗"><b>B</b></button>
      <button onclick="fmt('italic')" title="斜体"><i>I</i></button>
      <button onclick="fmt('underline')" title="画线（下划线）"><u>U</u></button>
      <button onclick="fmt('strikeThrough')" title="删除线"><s>S</s></button>
      <span class="sep"></span>
      <span class="hint">字色</span>
      <span class="sw" style="background:#d61f1f" onclick="fmt('foreColor','#d61f1f')" title="标红"></span>
      <span class="sw" style="background:#1d4ed8" onclick="fmt('foreColor','#1d4ed8')"></span>
      <span class="sw" style="background:#111" onclick="fmt('foreColor','#111111')"></span>
      <span class="hint" style="margin-left:6px">底色</span>
      <span class="sw" style="background:#fff3b0" onclick="fmt('hiliteColor','#fff3b0')" title="黄底"></span>
      <span class="sw" style="background:#dcfce7" onclick="fmt('hiliteColor','#dcfce7')"></span>
      <span class="sw" style="background:#fff;border-style:dashed" onclick="fmt('hiliteColor','transparent')" title="去底色"></span>
      <span class="sep"></span>
      <select onchange="fmt('fontSize',this.value);this.value=''"><option value="">字号</option><option value="2">小</option><option value="3">正文</option><option value="4">大</option><option value="5">标题</option></select>
      <button onclick="fmt('removeFormat')">清除格式</button>
      <button id="brushBtn" onclick="brushClick(event)" title="格式刷：先选中带格式的文字点一下，再去刷别的文字；双击锁定连续刷，Esc 退出">🖌 格式刷</button>
      <button onclick="unifySize()" title="把简历里细碎的字号差异统一成正文字号，标题保留">统一字号</button>
      <span class="sep"></span>
      <button onclick="insertBreak()">插入分页</button>
      <button onclick="addSection()">加一段标题</button>
      <span class="sep"></span>
      <span class="hint" id="saveState">未保存</span>
      <button class="sm primary" onclick="saveHist()">保存</button>
    </div>

    <div class="paper" id="paper">
      <div class="wmlayer" id="wmlayer"></div>
      <div class="doc-title" contenteditable="true" id="docTitle" spellcheck="false">推荐岗位-候选人姓名</div>
      <div class="sec-h"><span contenteditable="true" spellcheck="false">推荐语</span><span class="ctl"><span class="hint">拖动 ⋮⋮ 排序 · 点标签可改名 · 点 ✕ 删除</span></span></div>
      <div id="fields"></div>
      <div class="chips" id="suggest"></div>
      <div class="addrow"><input id="newField" placeholder="输入要加的字段名，回车添加"><button class="sm" onclick="addFieldFromInput()">添加字段</button><button class="sm ghost" onclick="openTpls()">按客户模板加载</button></div>

      <div class="pagebreak" id="preBreak" style="display:none" title="点击删除这个分页符" onclick="removeBreak(this)"><span>分页 ✕</span></div>
      <div class="divider" id="resDivider"><span>以下为候选人原始简历 · 选中任意文字即可标红 / 画线 / 高亮</span><span class="ctl"><button class="sm" onclick="togglePageImg()" id="imgToggle">按原页面图片</button><button class="sm" onclick="toggleResume()" id="resToggle">不附简历</button></span></div>
      <div class="resume" contenteditable="true" id="resumeDoc" spellcheck="false"></div>
    </div>
  </div>
</main>

<div class="bubble" id="bubble" onmousedown="event.preventDefault()"><span class="sw" style="background:#d61f1f" onclick="fmt('foreColor','#d61f1f')" title="标红"></span><span class="sw" style="background:#1d4ed8" onclick="fmt('foreColor','#1d4ed8')" title="标蓝"></span><span class="sw" style="background:#fff3b0" onclick="fmt('hiliteColor','#fff3b0')" title="黄底高亮"></span><b onclick="fmt('bold')" title="加粗">B</b><u onclick="fmt('underline')" title="画线">U</u><s onclick="fmt('strikeThrough')" title="删除线">S</s><i onclick="fmt('removeFormat');fmt('hiliteColor','transparent')" title="清除格式" style="font-style:normal;font-size:12px">清除</i></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="printArea" style="display:none"></div>
<style id="pageCss"></style>

<script>
const LS='reco_editor_v4';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}

/* ===== 字段同义词（只是帮助自动填，不限制字段） ===== */
const SYN={
 '姓名':['姓名','人选姓名','候选人'],'性别':['性别'],'年龄':['年龄'],'出生年份':['出生年份','出生'],'学校':['学校','学校名称','毕业院校','院校'],'在校时间':['在校时间','就读时间'],'学历':['学历','最高学历'],'是否统招本科':['统招','统招本科','是否统招本科','是否统招'],'英语':['英语','英语水平','外语','外语能力','英语能力','外语水平'],'学历&英语':['学历&英语','学历和英语'],

  /* 正文字号（按字数加权众数）、左边界、右边界、行距 */
  const cnt={};tl.forEach(l=>{const k=Math.round(l.fs*2)/2;cnt[k]=(cnt[k]||0)+l.text.length});const bodyFs=+Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
  const xs=tl.map(l=>l.x0).sort((a,b)=>a-b);const left=xs[Math.floor(xs.length*.1)]||0;const rs=tl.filter(l=>Math.abs(l.fs-bodyFs)<.6).map(l=>l.x1).sort((a,b)=>a-b);const right=rs[Math.floor(rs.length*.9)]||body[0].pw*.9;
  const gaps=[];for(let i=1;i<tl.length;i++)if(tl[i].page===tl[i-1].page){const g=tl[i-1].y-tl[i].y;if(g>0)gaps.push(g)}gaps.sort((a,b)=>a-b);const pitch=gaps[Math.floor(gaps.length/2)]||bodyFs*1.6;
  const runsOf=items=>{const raw=[];let prev=null;for(const it of items){let s=it.s;if(prev){const gap=it.x-(prev.x+prev.w);if(gap>it.fs*.3)s=' '+s}raw.push({s,col:it.col,bold:it.bold,fs:it.fs});prev=it}
    /* 夹在两段同色文字中间的短片段（括号、数字、空格）取不到颜色时，跟随两侧颜色 */
    for(let i=0;i<raw.length;i++){if(raw[i].col)continue;let j=i;while(j<raw.length&&!raw[j].col)j++;const L=raw[i-1],R=raw[j];const len=raw.slice(i,j).reduce((a,r)=>a+r.s.trim().length,0);if(L&&R&&L.col&&L.col===R.col&&len<=12)for(let k=i;k<j;k++)raw[k].col=L.col;i=j}
    const out=[];for(const r of raw){const last=out[out.length-1];if(last&&last.col===r.col&&last.bold===r.bold&&Math.abs(last.fs-r.fs)<.6)last.s+=r.s;else out.push(r)}return out};
  const splitCols=l=>{const segs=[[l.items[0]]];for(let i=1;i<l.items.length;i++){const a=l.items[i-1],b=l.items[i];if(b.x-(a.x+a.w)>l.fs*2.2&&a.s.trim()&&b.s.trim())segs.push([b]);else segs[segs.length-1].push(b)}return segs};
  const blocks=[];let para=null,prev=null;
  for(const l of body){if(l.img){const im=l.img;const pw=l.pw;const right=im.x0>pw*.55&&im.w<pw*.35;const center=!right&&Math.abs((im.x0+im.x1)/2-pw/2)<pw*.08;blocks.push({img:im,right,center});para=null;prev=l;continue}
    const ratio=l.fs/bodyFs,head=ratio>=1.25;const pw=l.pw;const center=Math.abs((l.x0+l.x1)/2-pw/2)<pw*.06&&(l.x1-l.x0)<pw*.7&&l.x0>left+pw*.08;const segs=splitCols(l);
    const sameP=prev&&prev.page===l.page;const g=sameP?prev.y-l.y:0;const extra=sameP?g-pitch:0;
    const wrap=para&&!para.head&&!para.cols&&!head&&segs.length===1&&prev&&prev.x1>=right-l.fs*1.3&&Math.abs(l.fs-prev.fs)<.6&&(!sameP||extra<pitch*.5)&&Math.abs(l.x0-left)<l.fs*1.6;
    if(wrap){const rs=runsOf(l.items);if(rs.length&&!/^\s/.test(rs[0].s)&&/[A-Za-z0-9]$/.test(para.runs[para.runs.length-1].s)&&/^[A-Za-z0-9]/.test(rs[0].s))rs[0].s=' '+rs[0].s;for(const r of rs){const last=para.runs[para.runs.length-1];if(last.col===r.col&&last.bold===r.bold&&Math.abs(last.fs-r.fs)<.6)last.s+=r.s;else para.runs.push(r)}prev=l;continue}
    para={head,center,fs:l.fs,indent:l.x0-left,mt:extra>pitch*.5?Math.min(extra,bodyFs*3):0,runs:runsOf(l.items),cols:segs.length>1?segs.map(seg=>({runs:runsOf(seg),x:seg[0].x})):null};blocks.push(para);prev=l}
  const k=14/bodyFs;const runHtml=r=>{const st=[];if(r.col)st.push('color:'+r.col);if(r.bold)st.push('font-weight:700');return st.length?`<span style="${st.join(';')}">${esc(r.s)}</span>`:esc(r.s)};
  /* 字号归档：相对正文的倍数归到 5 档，避免 10/10.5/11pt 这种细微差别在文档里看起来忽大忽小 */
  const tier=r=>r<.82?12:r<1.15?0:r<1.3?16:r<1.55?19:r<1.9?22:26;
  const html=blocks.map(b=>{if(b.img){const w=Math.round(b.img.w*k);return b.right?`<p style="margin:0;text-align:right"><img src="${b.img.src}" style="float:right;width:${w}px;margin:0 0 8px 14px"></p>`:`<p${b.center?' style="text-align:center"':''}><img src="${b.img.src}" style="width:${w}px"></p>`}
    const st=[];const px=tier(b.fs/bodyFs);if(px)st.push(`font-size:${px}px`);if(b.center)st.push('text-align:center');if(b.indent>b.fs*.8&&!b.center)st.push(`padding-left:${Math.round(b.indent*k)}px`);if(b.mt)st.push(`margin-top:${Math.round(b.mt*k)}px`);
    let inner;if(b.cols){inner=b.cols.map((c,i)=>{const nx=b.cols[i+1];const w=nx?Math.round((nx.x-c.x)*k):0;return `<span style="display:inline-block${w?`;min-width:${w}px`:''}">${c.runs.map(runHtml).join('')}</span>`+(nx?' ':'')}).join('')}else inner=b.runs.map(runHtml).join('');
    return `<p${st.length?` style="${st.join(';')}"`:''}>${inner||'<br>'}</p>`}).join('');
  const text=blocks.map(b=>b.img?'':b.cols?b.cols.map(c=>c.runs.map(r=>r.s).join('')).join('  '):b.runs.map(r=>r.s).join('')).join('\n');
  const font=serif>sans?`font-family:'Songti SC','SimSun','Noto Serif CJK SC',serif`:'';
  return{html:`<div${font?` style="${font}"`:''}>${html}</div>`,text,pages:pdf.numPages,scanned:false,watermark:[...WM].join(' '),images:nImgs,designed:nImgs>12,page:PG}}
let TEXT_HTML='';
const pagesHtml=()=>PAGES.map(s=>`<img src="${s}" style="width:100%;display:block;margin-bottom:8px">`).join('');
function togglePageImg(){const el=$('resumeDoc');if(!PAGES.length){toast('当前没有 PDF 页面图（重新上传 PDF 后可用）');return}pushUndo(showImg?'改回可编辑文字':'按原页面图片');showImg=!showImg;if(showImg){TEXT_HTML=el.innerHTML;el.innerHTML=pagesHtml();el.contentEditable='false';toast('已切换为原页面图片（不可编辑文字，导出时按图片输出）')}else{el.innerHTML=TEXT_HTML||S.resumeHtml||'';el.contentEditable='true';toast('已改回可编辑文字')}S.resumeHtml=el.innerHTML;save();renderImgToggle()}
function renderImgToggle(){$('imgToggle').textContent=showImg?'改回可编辑文字':'按原页面图片'}


/* ===== 输入事件 ===== */
let deb;function onInput(){clearTimeout(deb);deb=setTimeout(()=>{S.position=$('position').value;S.client=$('client').value;extract();refillUntouched();save();renderFields()},250)}
['position','client'].forEach(id=>$(id).oninput=onInput);
const drop=$('drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hover')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hover')}));
drop.addEventListener('drop',ev=>handleFile(ev.dataTransfer.files[0]));$('file').onchange=e=>handleFile(e.target.files[0]);
async function handleFile(f){if(!f)return;S.file=f.name;S.page=null;const done=(html,text,msg,asImg)=>{pushUndo(`读取文件「${f.name}」`);S.srcHtml=html;S.resume=text;showImg=!!asImg;TEXT_HTML=asImg?html:'';$('resumeDoc').contentEditable=asImg?'false':'true';renderImgToggle();showFile();applyPageSize();extract();refillUntouched();save();renderFields();pushResume();if(msg)toast(msg)};
  try{if(/\.(txt|md)$/i.test(f.name)){const t=await f.text();done(textToHtml(t),t,'已读取文本')}
  else if(/\.pdf$/i.test(f.name)){toast('正在解析 PDF，还原原始排版…');const r=await pdfToHtml(await f.arrayBuffer(),(p,n)=>$('filetag').innerHTML=`📄 ${esc(f.name)} <span class="pill p">解析第 ${p}/${n} 页</span>`);S.page=r.page||null;const wm=r.watermark?`；已去掉水印文字「${r.watermark.slice(0,20)}」`:'';if(r.scanned)done(r.html,r.text,'这份 PDF 没有文字层，已按页面图片带入');else if(r.designed)done(r.html,r.text,`这份简历是设计模板版式（${r.images} 个图片切片），已按原页面图片带入，点「改回可编辑文字」可切换${wm}`,true);else done(r.html,r.text,`已还原 ${r.pages} 页排版（字号、颜色、分栏${r.images?`、${r.images} 张图片`:''}）${wm}，可直接编辑、标红`)}
  else if(/\.docx$/i.test(f.name)){await ensureMammoth();const res=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});const tmp=document.createElement('div');tmp.innerHTML=res.value;done(res.value,tmp.innerText,'已读取 Word（保留标题、加粗、列表、表格）')}
  else{showFile();toast('旧版 .doc 无法直接解析，请另存为 .docx 或 PDF')}}
  catch(e){console.error(e);toast('解析失败：'+(e.message||e))}}
function showFile(){$('filetag').innerHTML=S.file?`📄 ${esc(S.file)} <span class="pill ok">已读取</span> <span class="pill ${/\.pdf$/i.test(S.file)?'':'warn'}">${/\.pdf$/i.test(S.file)?'PDF':'建议转 PDF'}</span> <a href="javascript:void 0" class="del" onclick="removeResume()" title="从文档里去掉这份简历（可撤销）">删除简历</a>`:''}
/* 删除已上传的简历：简历区清空、未手改过的自动填充字段也清掉；文件选择框重置以便重新选同一个文件 */
function removeResume(){if(!S.file&&!S.resume&&!$('resumeDoc').textContent.trim())return;pushUndo('删除简历');S.resume='';S.srcHtml='';S.resumeHtml='';S.file='';S.page=null;showImg=false;TEXT_HTML='';PAGES=[];$('resumeDoc').contentEditable='true';$('resumeDoc').innerHTML='';$('file').value='';S.fields.forEach(f=>{if(!f.touched)f.html=''});renderImgToggle();showFile();applyPageSize();extract();renderFields();updateMeta();save();toast('已删除简历，字段里自动填入的内容一并清空；可撤销')}
/* 新建报告：回到刚打开时的空白状态（模板、历史、水印设置保留），可撤销 */
function resetDoc(){const has=S.fields.length||S.resume||S.file||$('resumeDoc').textContent.trim()||S.position||S.client;if(has&&!confirm('清空当前文档，回到初始状态？（模板和历史记录保留，可用撤销找回）'))return;pushUndo('新建报告');const keep={tpls:S.tpls,hist:S.hist,wm:S.wm,wmText:S.wmText};Object.assign(S,BLANK(),keep);showImg=false;TEXT_HTML='';PAGES=[];$('file').value='';$('resumeDoc').contentEditable='true';renderImgToggle();initUI();renderTplList();toast('已新建空白报告')}
function initUI(){S.notes='';$('position').value=S.position||'';$('client').value=S.client||'';$('wmOn').checked=!!S.wm;$('wmText').value=S.wmText||'';showFile();applyPageSize();extract();if(S.title&&S.titleTouched)$('docTitle').textContent=S.title;$('resumeDoc').innerHTML=S.resumeHtml||'';renderBreak();renderFields();renderUndo()}
initTpls();initUI();
</script>
